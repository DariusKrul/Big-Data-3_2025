# Sharded MongoDB cluster for Big Data Analysis Task 3
# Topology:
#   - 1 config server  (configReplSet, single-node replica set)
#   - 1 shard          (shard1ReplSet, 3-node replica set)  <-- enables failover demo
#   - 1 mongos router  (the only entrypoint clients use)
#
# Bring up:
#   docker compose up -d
#   bash scripts/init-cluster.sh
#
# Connect from Python:  mongodb://localhost:27017
# (mongos is the only port exposed to the host; shards are reachable only on the internal Docker network.)

services:
  # -------------------------------------------------------------------------
  # CONFIG SERVER (single-node replica set)
  # Stores cluster metadata: chunk locations, shard key info, etc.
  # -------------------------------------------------------------------------
  configsvr:
    image: mongo:7
    container_name: configsvr
    command: >
      mongod --configsvr
             --replSet configReplSet
             --port 27019
             --bind_ip_all
             --wiredTigerCacheSizeGB 0.25
    volumes:
      - configsvr_data:/data/db
    networks:
      - mongo-cluster
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet --port 27019
      interval: 10s
      timeout: 5s
      retries: 6

  # -------------------------------------------------------------------------
  # SHARD 1: 3-node replica set
  # Real data lives here. Killing shard1a (the initial primary) triggers
  # an election between shard1b and shard1c -> demo for Task 5.
  # -------------------------------------------------------------------------
  shard1a:
    image: mongo:7
    container_name: shard1a
    command: >
      mongod --shardsvr
             --replSet shard1ReplSet
             --port 27018
             --bind_ip_all
             --wiredTigerCacheSizeGB 0.5
    volumes:
      - shard1a_data:/data/db
    networks:
      - mongo-cluster
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet --port 27018
      interval: 10s
      timeout: 5s
      retries: 6

  shard1b:
    image: mongo:7
    container_name: shard1b
    command: >
      mongod --shardsvr
             --replSet shard1ReplSet
             --port 27018
             --bind_ip_all
             --wiredTigerCacheSizeGB 0.5
    volumes:
      - shard1b_data:/data/db
    networks:
      - mongo-cluster
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet --port 27018
      interval: 10s
      timeout: 5s
      retries: 6

  shard1c:
    image: mongo:7
    container_name: shard1c
    command: >
      mongod --shardsvr
             --replSet shard1ReplSet
             --port 27018
             --bind_ip_all
             --wiredTigerCacheSizeGB 0.5
    volumes:
      - shard1c_data:/data/db
    networks:
      - mongo-cluster
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet --port 27018
      interval: 10s
      timeout: 5s
      retries: 6

  # -------------------------------------------------------------------------
  # MONGOS ROUTER
  # Single entrypoint for clients. Routes queries to the right shard.
  # -------------------------------------------------------------------------
  mongos:
    image: mongo:7
    container_name: mongos
    depends_on:
      configsvr:
        condition: service_healthy
      shard1a:
        condition: service_healthy
      shard1b:
        condition: service_healthy
      shard1c:
        condition: service_healthy
    command: >
      mongos --configdb configReplSet/configsvr:27019
             --port 27017
             --bind_ip_all
    ports:
      - "27017:27017"
    networks:
      - mongo-cluster

networks:
  mongo-cluster:
    driver: bridge

volumes:
  configsvr_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
